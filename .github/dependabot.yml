version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      minors:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: react
        versions:
          - ">=18.2.0"
      - dependency-name: react-dom
        versions:
          - ">=18.2.0"
      - dependency-name: "@types/react"
        versions:
          - ">=18.2.0"
      - dependency-name: "@types/react-dom"
        versions:
          - ">=18.2.0"
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
      - dependency-name: "@mui/material"
        versions:
          - ">=7.0.0"
      - dependency-name: "@mui/icons-material"
        versions:
          - ">=7.0.0"
      - dependency-name: "@mui/lab"
      # v4 is a rewrite: the PostCSS plugin moved packages, the JS config is no
      # longer auto-discovered, and `important: true` (which exists to beat
      # JupyterHub's bundled Bootstrap 5) changes shape. Needs a deliberate
      # migration, not a version bump.
      - dependency-name: "tailwindcss"
        versions:
          - ">=4.0.0"
      - dependency-name: "@rollup/rollup-linux-x64-gnu"
      - dependency-name: "@esbuild/linux-x64"
